<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Em Construção | João Pedro Baraúna</title>
    <!-- Importação do Font Awesome para os ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        /* Reset e Fontes */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Fundo com Gradiente idêntico ao da imagem */
        body {
            background: linear-gradient(135deg, #a6897c 0%, #4a8d9a 30%, #0d416b 70%, #021223 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
        }

        /* Container Principal */
        .aviso-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 600px;
            width: 100%;
        }

        /* Ícone de Construção/Aviso */
        .icone-aviso {
            font-size: 4.5rem;
            margin-bottom: 1.5rem;
            color: #ffffff;
            /* Leve sombra para destacar no fundo */
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.2));
        }

        /* Textos */
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        p {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.85);
            /* Branco levemente transparente */
            margin-bottom: 2.5rem;
            line-height: 1.5;
        }

        /* Botão de Voltar (Estilo idêntico aos links do portfólio) */
        .btn-voltar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.05);
            /* Fundo quase transparente */
            color: #ffffff;
            text-decoration: none;
            padding: 1rem;
            border-radius: 12px;
            font-weight: 500;
            font-size: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.4);
            /* Borda branca fina */
            transition: all 0.3s ease;
        }

        /* Efeito ao passar o mouse */
        .btn-voltar:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #ffffff;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <div class="aviso-container">
        <!-- Ícone representativo -->
        <i class="fa-solid fa-person-digging icone-aviso"></i>

        <h1>Página em Construção</h1>
        <p>Meu portfólio de UX/UI está recebendo os últimos ajustes. Em breve, novos projetos estarão disponíveis por
            aqui!</p>

        <!-- Botão para voltar à página principal -->
        <a href="index.html" class="btn-voltar">
            <i class="fa-solid fa-arrow-left"></i> Voltar para os Links
        </a>
    </div>

</body>

</html>
